kind: Breaking changes
body: |-
    **Published types carry `#[deprecated]` where the `.proto` says `[deprecated = true]`** (#564). Reading one of these from your crate now warns: `google.protobuf.Method::{syntax, edition}` in `buffa-types`, and in `buffa-descriptor` the option fields `FieldOptions::weak`, `FileOptions::java_generate_equals_and_hash`, `MessageOptions::deprecated_legacy_json_field_conflicts` and `EnumOptions::deprecated_legacy_json_field_conflicts`. A crate built with `-D warnings` or `#![deny(warnings)]` fails after the upgrade until `#[allow(deprecated)]` is on each use it keeps. The markers are always on.
time: 2026-10-05T04:40:00+08:00
