kind: Fixed
body: |-
    **`[deprecated = true]` is now emitted as `#[deprecated]`** (#548). Codegen dropped the option entirely, so a proto field or enum value marked deprecated compiled silently in Rust and migrating from prost lost every deprecation warning. Generated declarations now carry the marker the way prost-build emits it, and the generated items that must visit every field — the codec impls, `Debug`, `Default` (owned and view), the `with_*` setters, the hand-written JSON `Deserialize` impl, reflection, the view and lazy-view `to_owned`, a table message's static, and an enum's `allow_alias`/idiomatic consts — carry `#[allow(deprecated)]`, so a single deprecated field no longer floods the build with warnings from generated code. The `with_*` setter of a deprecated field is itself deprecated, so the builder API is not a quiet way to set it, and `allow_alias` values plus their idiomatic `CamelCase` consts inherit the variant's marker, so an alias is not an escape hatch either. A field that already restored the marker by hand with `field_attribute(path, "#[deprecated...]")` keeps its own note rather than getting a second `deprecated` attribute, which rustc rejects, and behaves the same way from either source. Codec behavior is unchanged: deprecated values still round-trip through binary, JSON and text formats, and stay in `Enumeration::values()` / `from_i32` / `from_proto_name`. Oneof variants and the view read path (`FooView` fields, `FooOwnedView` accessors) are not marked yet, and whole-message/whole-enum deprecation is not emitted, matching prost. See the breaking-change entry for the effect on `-D warnings` builds.
